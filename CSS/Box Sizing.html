<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #parent{
            position: relative;
            width: 800px;
            height: 500px;
            background-color: pink;
            border: 3px solid brown;

        }
    
    
    
    #d1{
        position: relative;
        width:200px;
        height:150px;
        background-color: aqua;
        border: 2px solid red;
        padding:20px;
        box-sizing: border-box;
        box-shadow: 10px 10px 3px 5px blue;
        left: 50px;
        top: 30px;
        z-index: 3;
        transition: 5s transform;
    }
    
    #d1{
        animation: move 3s infinite alternate;
    }
    
    @keyframes move{
        from{
            transform: translate(0px);
        }

        to{
            transform: translate(150px);
        }
    }
    
    #d1:hover{
        transform: scale(1.5);
        /* transform:rotate(60deg) */
        /* transform:skew(40deg) */
    }


    #d2{
     position: absolute;
        width:200px;
        height:150px;
        background-color: aqua;
        border: 2px solid red;
        padding:20px;
        box-sizing: border-box;
        left: 100px;
        top: 100px;
        z-index: 2;
    }







</style>
</head>


<body>
   
   <div id="parent">
    <div id="d1">This is div section</div> 
   <div id="d2">This is 2nd div</div>


</div>




</body>
</html>
