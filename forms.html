<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <form action="/Hyperlinks.html" method="get">
    <fieldset>
<legend><b>Registration Form</b></legend>


    <label for="u1">Username:</label>
    <input type="text" id="u1" name="uname" value="Rohan" maxlength="6"
    placeholder="Enter Username" size="50"required autofocus>
    <br><br>
    <label for="u2">Password:</label>
    <input type="text" id="u2" name="password" minlength="6" placeholder="Enter Password" size="50"value=389 readonly>
    <br><br>
    <label for="e1">Email:</label>
    <input type="email" id="e1" name="email" value="abcj1234@gmail.com" disabled>

    <br><br>
    <label for="add1">Enter Address:</label><br>
    <textarea name="address" id="add1" rows="10" cols="40">Jalandhar</textarea>
    <br><br>
    
   <label for="h1">Hobbies:</label>
   <input type="checkbox" name="hobby" id="h1" value="hobbies">
   <label for="cook1">Cooking</label>
   <input type="checkbox" name="hobby" id="cook1" value="cooking" >
   <label for="sing1">Singing</label>
   <input type="checkbox" name="hobby" id="sing1" value="singing">
   <label for="speak1">Public speaking</label>
   <input type="checkbox" name="hobby" id="speak1" value="public speaking">
  
   <br><br>
  <label for="z1">Select Courses:</label>
  <input type="radio" name="courses" id="z1" value="select courses">
   <label for="b1">Btech</label> 
   <input type="radio" name="course" id="b1" value="btech" checked>
   <label for="t1">BCA</label>
   <input type="radio" name="course" id="t1" value="bca">
   <label for="z1">BSC</label>
   <input type="radio" name="course" id="z1"  value="bsc">
   <br><br>

   <label for="state1">Choose state:</label><br>
   <select name="state" id="state1" size="2" multiple>
    <option value="punjab" selected>Punjab</option>
    <option value="himachal">Himachal Pradesh</option>
    <option value="andhra">Andhra Pradesh</option>
    <option value="rajasthan">Rajasthan</option>
</select>
<br><br>

<label for="marks">Enter Marks:</label>
<input type="number" id="marks" max="20" min="0" step="3">








<label for="upload">Upload file</label>
<input type="file" id="upload" name="upload" accept="image/*">
   
   
   
   
   
   
   <br><br>
   <input type="date" id="date" name="date">
   <input type="time" id="time" name="time">
    <input type="submit" name="submit" id="submit" value="Submit Form">
    <input type="reset" id="reset">
    <input type="button" value="OK">

   









</fieldset>
</form> 


































</body>
</html>
