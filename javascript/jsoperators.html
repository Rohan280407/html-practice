<!DOCTYPE html>

    <meta charset="UTF-8">

<body>
<script>
        //Arithmetic Operator
         let a= 60;
         let b=90;
         console.log(a+b,a-b,a*b,a/b,a%b, a++,++a,a--,--a);

        let x=10;
        let y=++x;
        console.log(x);
        console.log(y);
        
        //Assignment Operators
        let q=10;
        let r=20;
        console.log(q+=r,q-=r,q*=r);
        
        //Comparison Operators
        let w=10;
        let s="10";
        console.log(w!==s,w>=s);

        //Logical Operators
        let p=10;
        let t=20;
        console.log((p>t)&&(p==t));

        let q1=3;
        let q2=3;
        console.log(!((q1>q2)||(q1==q2)));

        

        
    // branching statements
    var marks = 85;

    if (marks >= 90) {
        console.log("Elite batch");
    } 
    else if (marks >= 75) {
        console.log("Intermediate batch");
    } 
    else if (marks >= 60) {
        console.log("Regular batch");
    } 
    else {
        console.log("Fail");
    }






</script>
