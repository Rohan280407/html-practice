    }while(k<=20);

///print multiplicaction table///

    //using while loop
     var num = 8;
     var i = 1;

    while (i <= 10) {
    console.log(num + " x " + i + " = " + (num * i));
    i++;
}

    //using for loop

    var num = 8;

    for (var i = 1; i <= 10; i++) {
        console.log(num + " x " + i + " = " + (num * i));
    }

    //using do-while loop
    var num = 8;
    var i = 1;

    do {
    console.log(num + " x " + i + " = " + (num * i));
    i++;
} while (i <= 10);
